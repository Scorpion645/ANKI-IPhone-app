name: Build AnkiSync unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate repository files and launch configuration
        run: |
          set -euo pipefail
          for file in project.yml AnkiSync/Info.plist AnkiSync/Sources/AnkiSyncApp.swift AnkiSync/Sources/AnkiSyncViewController.swift AnkiSync/Resources/AnkiSync.html; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing $file. Upload the contents of the source ZIP to the repository ROOT, not inside an extra enclosing folder."
              exit 1
            fi
          done
          python3 - <<'PYPLIST'
          import plistlib
          with open('AnkiSync/Info.plist', 'rb') as f: p=plistlib.load(f)
          assert isinstance(p.get('UILaunchScreen'), dict), 'AnkiSync/Info.plist is outdated: add <key>UILaunchScreen</key><dict/> before the final </dict>'
          assert 'UILaunchStoryboardName' not in p, 'Old storyboard launch key is still present'
          print('Launch-screen dictionary found in Info.plist (no storyboard build required).')
          PYPLIST
          echo 'Available Xcode:'
          xcodebuild -version
          echo 'iPhoneOS SDK:'
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iOS app without signing
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project AnkiSync.xcodeproj -scheme AnkiSync -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA and verify launch configuration
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release-iphoneos/AnkiSync.app
          test -f "$APP/AnkiSync"
          test -f "$APP/AnkiSync.html"
          python3 - "$APP/Info.plist" <<'PYPLIST'
          import plistlib,sys
          with open(sys.argv[1],'rb') as f: p=plistlib.load(f)
          assert isinstance(p.get('UILaunchScreen'),dict), 'Compiled app has no UILaunchScreen. Verify AnkiSync/Info.plist was updated on main.'
          print('Verified supported launch-screen dictionary in compiled IPA.')
          PYPLIST
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry AnkiSync-unsigned.ipa Payload)
          unzip -t build/AnkiSync-unsigned.ipa | tail -1

      - name: Download unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AnkiSync-unsigned-IPA
          path: build/AnkiSync-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log if anything fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AnkiSync-build-diagnostics
          path: |
            build/xcodebuild.log
            AnkiSync.xcodeproj/project.pbxproj
            project.yml
            AnkiSync/Info.plist
          if-no-files-found: warn
          retention-days: 7
