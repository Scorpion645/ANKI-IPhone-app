name: AnkiSync
options:
  bundleIdPrefix: app.ankisync.personal
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: "NO"
targets:
  AnkiSync:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: AnkiSync/Info.plist
    sources:
      - path: AnkiSync/Sources
      - path: AnkiSync/Resources/AnkiSync.html
        buildPhase: resources
      - path: AnkiSync/Resources/LaunchScreen.storyboard
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ankisync.personal.reader
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
    scheme:
      testTargets: []
